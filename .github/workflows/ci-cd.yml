name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nome-da-sua-api # Altere para o nome desejado da imagem

jobs:
  # ==============================
  # 1. Validação NestJS (Backend)
  # ==============================
  backend-validation:
    name: Backend (NestJS) - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de Lint
        run: npm run lint

      - name: Testes Unitários
        run: npm run test -- --passWithNoTests

      - name: Validação do Build TypeScript
        run: npm run build

  # ==============================
  # 2. Build & Push da Imagem Docker (Apenas na main se os testes passarem)
  # ==============================
  docker-publish:
    name: Build and Push Docker Image
    needs: [backend-validation] # Aguarda a validação do backend com sucesso
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir e Publicar Imagem
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
